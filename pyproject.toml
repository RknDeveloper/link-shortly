[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "link-shortly"
dynamic = ["version"]
description = "An async and sync Python client for URL-shortening services"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "rkndeveloper", email = "vardhacopyrightteam@gmail.com"}
]
keywords = ["link-shortener", "url-shortener", "api-wrapper", "tinyurl", "bitly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.14.3,<4.0",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/RknDeveloper/link-shortly"
Documentation = "https://github.com/RknDeveloper/link-shortly#readme"
Source = "https://github.com/RknDeveloper/link-shortly"
Tracker = "https://github.com/RknDeveloper/link-shortly/issues"
Changelog = "https://github.com/RknDeveloper/link-shortly/releases"

[tool.setuptools]
packages = ["shortly"]

[tool.setuptools.dynamic]
version = {attr = "shortly.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
